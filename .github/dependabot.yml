version: 2
updates:
  # Rust-зависимости workspace
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Frontend-зависимости
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Версии GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
