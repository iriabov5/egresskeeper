# Конфигурация статического анализа для SonarQube.
#
# Анализ Rust выполняется через Clippy: отчёт формируется командой `make sonar`
# и импортируется свойством sonar.rust.clippyReport.reportPaths.

sonar.projectKey=egresskeeper
sonar.projectName=EgressKeeper
sonar.sourceEncoding=UTF-8

# Исходники: ядро (Rust), обвязка Tauri и UI (TypeScript).
sonar.sources=src,crates,src-tauri/src
sonar.tests=src,crates,src-tauri
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/tests/**/*.rs

# Вне анализа: сборка, зависимости, сгенерированные файлы и общие fixtures.
sonar.exclusions=dist/**,node_modules/**,target/**,src-tauri/gen/**,contracts/**

# Rust: отчёт Clippy готовится заранее (см. `make sonar`), потому что в среде
# анализа нет Rust-тулчейна. Метрики Rust (сложность, дублирование) считаются
# анализатором самостоятельно.
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=target/sonar/clippy-report.json

# Покрытие: отчёты формируются командой `make sonar` (cargo-llvm-cov и vitest).
sonar.rust.lcov.reportPaths=target/sonar/rust-lcov.info
sonar.javascript.lcov.reportPaths=target/sonar/coverage-web/lcov.info
